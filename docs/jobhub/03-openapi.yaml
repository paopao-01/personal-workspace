openapi: 3.0.3
info:
  title: JobHub V0.1 API
  version: 0.1.0
  description: |
    本地单用户模式 API。状态转换以 `02-state-machines.md` 为准；未经用户确认的候选要求不得作为确定性结论。
    所有 POST、PUT、DELETE 及状态转换接口均应支持 Idempotency-Key；带 version 的资源更新应提交 If-Match-Version。
servers:
  - url: http://localhost:8080/api
    description: 本地开发服务
tags:
  - name: Jobs
  - name: Applications
  - name: Interviews
  - name: Reviews
  - name: Tasks
  - name: SkillsAndEvidence
  - name: DataManagement
  - name: Notifications
  - name: Ai
paths:
  /dashboard:
    get:
      tags: [Jobs, Applications, Interviews, Tasks]
      summary: 获取首页工作台聚合数据
      responses:
        '200': { description: 今日行动、未来面试、进行中投递和薄弱点, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardOverview' } } } }
  /jobs:
    get:
      tags: [Jobs]
      summary: 查询岗位列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: decisionStatus
          in: query
          schema: { $ref: '#/components/schemas/JobDecisionStatus' }
        - name: jobStatus
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - name: location
          in: query
          schema: { type: string, maxLength: 100 }
        - name: source
          in: query
          schema: { type: string, maxLength: 100 }
        - name: hasPendingRequirements
          in: query
          schema: { type: boolean }
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 岗位分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageJob' }
    post:
      tags: [Jobs]
      summary: 创建岗位并保存 JD 原文
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreateRequest' }
      responses:
        '201':
          description: 创建成功
          content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /jobs/{jobId}:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      summary: 获取岗位详情
      responses:
        '200': { description: 岗位详情, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Jobs]
      summary: 更新岗位基础信息或投递决定
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /jobs/{jobId}/archive:
    parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    post:
      tags: [Jobs]
      summary: 归档岗位
      responses:
        '200': { description: 已归档, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /jobs/{jobId}/restore:
    parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    post:
      tags: [Jobs]
      summary: 恢复已归档岗位
      responses:
        '200': { description: 已恢复, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
  /jobs/{jobId}/requirements/extract:
    parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    post:
      tags: [Jobs]
      summary: 使用基础规则提取候选岗位要求
      description: P0 同步规则提取；不使用 AI，结果均为 PENDING，且不会自动覆盖已确认要求。
      responses:
        '200':
          description: 候选要求
          content: { application/json: { schema: { $ref: '#/components/schemas/RequirementExtractionResult' } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /jobs/{jobId}/requirements:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      summary: 查询岗位要求及确认状态
      responses:
        '200':
          description: 岗位要求列表
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JobRequirement' } } } }
  /job-requirements/{requirementId}:
    parameters: [ { $ref: '#/components/parameters/RequirementId' } ]
    put:
      tags: [Jobs]
      summary: 确认、编辑、忽略或恢复单项岗位要求
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/JobRequirement' } } } }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      tags: [Jobs]
      summary: 删除未确认的候选岗位要求
      description: 仅允许删除 PENDING 或 IGNORED 候选；已确认要求应先恢复为待确认，避免静默丢失用户确认事实。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '204': { description: 已删除 }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /job-requirements/merge:
    post:
      tags: [Jobs]
      summary: 合并同一岗位的重复要求
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementMergeRequest' }
      responses:
        '200': { description: 合并后的目标要求, content: { application/json: { schema: { $ref: '#/components/schemas/JobRequirement' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /jobs/{jobId}/match-reports:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      summary: 查询岗位匹配报告历史
      description: 返回该岗位的历史快照，按生成时间倒序；每条报告都在读取时计算 stale 标记。
      responses:
        '200': { description: 匹配报告历史, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MatchReport' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Jobs]
      summary: 生成岗位匹配报告（可解释规则计算，保存数据快照；缺少资料的要求不计入分母）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: 报告已生成, content: { application/json: { schema: { $ref: '#/components/schemas/MatchReport' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/match-reports/latest:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      summary: 查询最新匹配报告（输入数据变化后 stale=true，提示可能过期）
      responses:
        '200': { description: 最新报告, content: { application/json: { schema: { $ref: '#/components/schemas/MatchReport' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobId}/gap-list:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      summary: 获取可解释差距清单
      responses:
        '200':
          description: 差距项；只基于 CONFIRMED 要求
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GapItem' } } } }

  /applications:
    get:
      tags: [Applications]
      summary: 查询投递列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: overdueActionOnly
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: 投递分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/PageApplication' } } } }
    post:
      tags: [Applications]
      summary: 创建投递记录
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/DuplicateApplication' }
  /applications/{applicationId}:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      tags: [Applications]
      summary: 获取投递详情
      responses:
        '200': { description: 投递详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationDetail' } } } }
    put:
      tags: [Applications]
      summary: 更新投递元数据与下一步行动，不改变当前状态
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      tags: [Applications]
      summary: 软删除无关联面试的投递记录
      description: 已有关联面试时先删除面试，保留事实链和可恢复性。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      responses:
        '204': { description: 已移入最近删除 }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /applications/{applicationId}/transition:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
    post:
      tags: [Applications]
      summary: 转换投递状态
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationTransitionRequest' }
      responses:
        '200': { description: 转换成功, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /applications/{applicationId}/status-history:
    parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
    get:
      tags: [Applications]
      summary: 查询投递状态历史
      responses:
        '200': { description: 状态历史, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StatusLog' } } } } }

  /interviews:
    get:
      tags: [Interviews]
      summary: 查询面试日程（列表或日历）
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: scheduleStatus
          in: query
          schema: { $ref: '#/components/schemas/InterviewScheduleStatus' }
        - name: applicationStatus
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: mode
          in: query
          schema: { type: string, enum: [ONLINE, ONSITE, PHONE] }
      responses:
        '200': { description: 面试列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InterviewListItem' } } } } }
    post:
      tags: [Interviews]
      summary: 创建面试日程
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewCreateRequest' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /interviews/upcoming:
    get:
      tags: [Interviews]
      summary: 查询未来面试
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InterviewScheduleStatus' }
      responses:
        '200': { description: 面试列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Interview' } } } } }
  /interviews/{interviewId}:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    get:
      tags: [Interviews]
      summary: 获取面试详情
      responses:
        '200': { description: 面试详情, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewDetail' } } } }
    put:
      tags: [Interviews]
      summary: 更新非状态字段
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewUpdateRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
    delete:
      tags: [Interviews]
      summary: 软删除面试日程
      description: 取消未发送提醒；复盘与问题保留，恢复日程后可继续访问。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      responses:
        '204': { description: 已移入最近删除 }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /interviews/{interviewId}/complete:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    post:
      tags: [Interviews]
      summary: 标记面试完成
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/InterviewCompleteRequest' } } }
      responses:
        '200': { description: 已完成, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /interviews/{interviewId}/cancel:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    post:
      tags: [Interviews]
      summary: 取消面试
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: 已取消, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
  /interviews/{interviewId}/no-show:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    post:
      tags: [Interviews]
      summary: 标记面试缺席
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: 已标记缺席, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /interviews/{interviewId}/reschedule:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    post:
      tags: [Interviews]
      summary: 改期面试并重算提醒
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InterviewRescheduleRequest' } } }
      responses:
        '200': { description: 改期成功, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /interviews/{interviewId}/preparation:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    get:
      tags: [Interviews]
      summary: 获取面试准备包
      responses:
        '200': { description: 由现有数据聚合，不复制业务数据, content: { application/json: { schema: { $ref: '#/components/schemas/PreparationPack' } } } }
  /interviews/{interviewId}/checklist/{checklistItemId}:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
      - name: checklistItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Interviews]
      summary: 更新面试准备事项完成状态
      description: 只更新准备事项的 completed 字段，并使用面试版本进行乐观锁保护；不改变学习任务状态。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChecklistUpdateRequest' } } }
      responses:
        '200': { description: 更新后的面试, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /interviews/{interviewId}/reminders:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    get:
      tags: [Interviews]
      summary: 查询提醒计划
      responses:
        '200': { description: 提醒列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Reminder' } } } } }
    post:
      tags: [Interviews]
      summary: 创建或重新生成提醒节点
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReminderCreateRequest' } } }
      responses:
        '201': { description: 提醒已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Reminder' } } } }
  /reminders/{reminderId}:
    parameters: [ { $ref: '#/components/parameters/ReminderId' } ]
    put:
      tags: [Interviews]
      summary: 更新未触发提醒或关闭提醒
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReminderUpdateRequest' } } }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/Reminder' } } } }
  /reminders/{reminderId}/retry:
    parameters: [ { $ref: '#/components/parameters/ReminderId' } ]
    post:
      tags: [Interviews]
      summary: 重试失败的提醒展示
      description: FAILED 提醒重新进入 PENDING；不会自动重试，也不会修改用户填写的面试事实。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      responses:
        '200': { description: 提醒已重新排队, content: { application/json: { schema: { $ref: '#/components/schemas/Reminder' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }

  /interviews/{interviewId}/review:
    parameters: [ { $ref: '#/components/parameters/InterviewId' } ]
    get:
      tags: [Reviews]
      summary: 获取当前复盘
      responses:
        '200': { description: 当前复盘, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewReview' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reviews]
      summary: 创建或保存复盘草稿
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersionOptional' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviewUpsertRequest' } } }
      responses:
        '200': { description: 草稿已保存, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewReview' } } } }
  /reviews/{reviewId}/complete:
    parameters: [ { $ref: '#/components/parameters/ReviewId' } ]
    post:
      tags: [Reviews]
      summary: 完成复盘
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      responses:
        '200': { description: 复盘已完成, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewReview' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /reviews/{reviewId}/reopen:
    parameters: [ { $ref: '#/components/parameters/ReviewId' } ]
    post:
      tags: [Reviews]
      summary: 重新打开已完成的复盘（COMPLETED → DRAFT，保留问题与任务关联）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      responses:
        '200': { description: 复盘已重新打开, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewReview' } } } }
