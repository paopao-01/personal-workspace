      responses:
        '200':
          description: 导出文件
          content:
            application/json:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /data-imports/validate:
    post:
      tags: [DataManagement]
      summary: 数据包冲突预检与恢复预览（不写库）
      description: |
        解析 P0/P1 导出的标准 JSON 数据包，做冲突预检：同 ID 已存在且内容一致的行标记为重复（恢复时跳过），
        同 ID 已存在但内容不同的行标记为冲突（恢复时跳过，保留现状，用户事实优先），
        外键父行（数据库与数据包中均不存在）标记为缺父级（恢复时跳过）。
        该端点只读，不产生任何数据副作用；恢复预览即影响范围展示。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DataImportPackage' } } }
      responses:
        '200': { description: 预检与恢复预览, content: { application/json: { schema: { $ref: '#/components/schemas/ImportValidationReport' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /data-imports/restore:
    post:
      tags: [DataManagement]
      summary: 执行数据恢复（只插入缺失行，不覆盖已有数据）
      description: |
        按预检结果执行恢复：仅插入数据库中缺失的行；重复行、冲突行与缺父级行一律跳过并在结果报告中列出，
        不修改、不覆盖任何已有行。恢复为幂等操作：重复恢复同一数据包时第二次全部标记为“重复跳过”。
        结果报告即恢复结果报告（每表 inserted/skipped/failed 计数与问题明细）。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DataImportPackage' } } }
      responses:
        '200': { description: 恢复结果报告, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResultReport' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
