  /backups:
    get:
      tags: [Backups]
      summary: 查询加密备份记录列表（最新优先）
      responses:
        '200': { description: 备份记录列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BackupRecord' } } } } }
    post:
      tags: [Backups]
      summary: 生成加密备份（复用标准数据包，AES-256-GCM 加密；passphrase 仅写入不回显；弱口令拒绝）
      description: |
        复用标准数据包导出生成 JSON 数据包，用 PBKDF2（随机 16B salt、10 万次迭代）从 passphrase 派生
        AES-256-GCM 密钥加密，密文写入 backup-dir；salt 与 iv 随记录落库以供未来恢复派生密钥，
        passphrase 与派生密钥永不持久化。备份为追加型只读历史，本端点不实现恢复。
        passphrase 强度门槛（强制）：入口按与前端同一算法评估（维度：长度/字符种类/弱模式扣分，阈值
        弱<40/中40–69/强≥70，见 02-state-machines.md §9）；score<40（弱）返回 400 VALIDATION_ERROR，
        含 score 与失败规则，不进行加密与落盘。强度评估在内存进行，passphrase 不落盘/不进日志/不回显，
        不新增评估端点（passphrase 本就要传给本端点派生密钥，无额外传输）。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BackupCreateRequest' } } }
      responses:
        '201': { description: 已生成, content: { application/json: { schema: { $ref: '#/components/schemas/BackupRecord' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
    delete:
      tags: [Backups]
      summary: 批量清理加密备份（按龄 olderThanDays 或按数量 keepLast，二选一）
      description: |
        批量物理删除 `backup_record` 行及其落盘 `.enc` 密文文件，不可恢复，不进入最近删除（`trash_item`）。
        语义同单条删除（`DELETE /backups/{backupId}`）：每行配套清理密文文件（文件不存在视为已清理不报错）；
        若被删集合包含 `backup_schedule.last_backup_id` 指向的记录，则将该软引用置空（不影响 armed 内存状态
        与调度配置）；`data_export_id` 软引用行不联动删除（独立历史快照，悬空可接受）。
        `backup_record` 无 `version` 列，不使用 `If-Match-Version` 乐观锁；要求携带 `X-Confirm-Permanent-Delete: true`
        确认头以防误清（缺失或非 `true` 返回 400）。

        两种互斥清理条件，有且仅有一个：
        - `olderThanDays`（≥1）：按龄清理，删除 `created_at` 早于「当前 UTC − N 天」的全部备份；
        - `keepLast`（≥1）：按数量保留，保留最近 N 条（按 `created_at DESC`），删除其余全部。

        同时缺省、同时出现、或任一 <1 均返回 400，防止误清空全部备份。`keepLast ≥ 现有总数` 时无备份被删，
        返回 200 `deletedCount=0`（不报 404，空集合法）。passphrase 不参与清理验证（清理即销毁密钥材料）；
        passphrase 与派生密钥永不持久化。返回清理摘要（删除记录数、清理文件数、是否置空 last_backup_id），
        幂等性由 `Idempotency-Key` 保证（重复回放返回相同摘要，不重新执行清理）。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: olderThanDays
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: 按龄清理阈值天数（≥1），删除 created_at 早于「当前 UTC − N 天」的全部备份；与 keepLast 互斥
        - name: keepLast
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: 按数量保留阈值（≥1），保留最近 N 条（created_at DESC）并删除其余；与 olderThanDays 互斥
        - name: X-Confirm-Permanent-Delete
          in: header
          required: true
          schema: { type: boolean, enum: [true] }
      responses:
        '200': { description: 清理摘要, content: { application/json: { schema: { $ref: '#/components/schemas/BackupPurgeSummary' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /backups/schedule:
    get:
      tags: [Backups]
      summary: 查询定时备份调度配置
      description: |
        返回单行调度配置（cron 表达式、enabled、armed 内存武装状态、version、上次运行结果）。
        `armed` 反映进程内存中是否持有 passphrase：应用重启后自动为 false，需用户重新武装。
        passphrase 与派生密钥永不持久化，`armed` 字段仅反映内存状态，不回显 passphrase。
      responses:
        '200':
          description: 调度配置
          content: { application/json: { schema: { $ref: '#/components/schemas/BackupSchedule' } } }
    put:
      tags: [Backups]
      summary: 更新定时备份调度配置（cron 表达式 + enabled）
      description: |
        单行配置的乐观锁更新（携带当前 version）。cron 表达式须为合法标准 5/6 字段表达式。
        enabled=false 时调度器停用；enabled=true 但未 armed（无内存 passphrase）时到点记 SKIPPED_DISARMED，
        不生成备份。本端点不接收 passphrase（passphrase 经 arm 端点单独武装，仅存内存）。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatchVersion' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BackupScheduleUpdateRequest' } } }
      responses:
        '200':
          description: 更新后的配置
          content: { application/json: { schema: { $ref: '#/components/schemas/BackupSchedule' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /backups/schedule/arm:
    post:
      tags: [Backups]
      summary: 武装调度器（注入内存 passphrase；弱口令拒绝）
      description: |
        将 passphrase 写入进程内存武装调度器（volatile），供定时触发时加密生成备份。
        passphrase 仅存内存，不落盘、不回显、不进日志；应用重启后自动解除武装。
        武装状态可通过 GET /backups/schedule 的 armed 字段查询，但不回显 passphrase。
        passphrase 强度门槛（强制）：入口按与前端同一算法评估（阈值弱<40，见 02-state-machines.md §9）；
        score<40（弱）返回 400 VALIDATION_ERROR，含 score 与失败规则，不写入内存武装。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BackupArmRequest' } } }
      responses:
        '200':
          description: 武装后的配置（armed=true）
          content: { application/json: { schema: { $ref: '#/components/schemas/BackupSchedule' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /backups/{backupId}:
    parameters: [ { $ref: '#/components/parameters/BackupId' } ]
    delete:
      tags: [Backups]
      summary: 删除加密备份记录（物理删除，不可恢复，不进入最近删除）
      description: |
        物理删除指定 `backup_record` 行及其落盘的 `.enc` 密文文件，不可恢复，不进入最近删除（`trash_item`）。
        `backup_record` 无 `version` 列，删除不使用 `If-Match-Version` 乐观锁；要求携带
        `X-Confirm-Permanent-Delete: true` 确认头以防误删。删除为销毁性操作：删除后密文文件与
        记录行一并清除，对应的 salt/iv 与派生密钥材料随之不可用；passphrase 不参与删除验证
        （删除即销毁，无需再验）。若被删备份 id 等于 `backup_schedule.last_backup_id`，
        则将该软引用置空（不影响 armed 内存状态）。`data_export_id` 软引用的导出记录行不联动删除
        （保留为独立历史快照，悬空软引用无外键阻拦）。passphrase 与派生密钥永不持久化。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: X-Confirm-Permanent-Delete
          in: header
          required: true
          schema: { type: boolean, enum: [true] }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /backups/{backupId}/download:
    parameters: [ { $ref: '#/components/parameters/BackupId' } ]
    get:
      tags: [Backups]
      summary: 下载加密备份文件（application/octet-stream）
      responses:
        '200': { description: 加密备份文件, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /backups/restore:
    post:
      tags: [Backups]
      summary: 恢复加密备份（上传 .enc 文件 + passphrase，解密后行级幂等恢复；passphrase 不做强校验）
      description: |
        接收 multipart/form-data：file 为加密备份 .enc 文件（application/octet-stream），
        passphrase 为文本。按 .enc 密文布局（salt(16) || iv(12) || ciphertext+gcmTag）拆分，
        用 PBKDF2（同生成端参数）从 passphrase 派生 AES-256-GCM 密钥解密，解析为标准 JSON 数据包，
        再委托标准数据恢复（ImportService.restore）执行行级幂等恢复：仅插入缺失行，重复/冲突/缺父级行跳过并列出，
        不覆盖任何已有行（用户事实优先）。passphrase 与派生密钥永不持久化、不回显、不进日志。
        数据库丢失（backup_record 清空）后仍可凭 .enc 文件与 passphrase 恢复，具备灾难恢复能力。
        恢复端点**不**强制 passphrase 强度门槛：passphrase 已与备份绑定（用于解密既有密文），强制无意义且会
        锁死门槛上线前用弱口令创建的历史备份；解密失败（GCM 认证失败）返回 422，与强度无关。
        恢复成功后自动触发一次孤儿 .enc 文件扫描清理（best-effort，复用 `POST /backups/orphans/clean`
        判定逻辑：扫描 `jobhub.backup-dir` 下 `.enc`、合法 UUID 且 `backup_record` 无对应 `file_name` 即孤儿、物理删除；
        非 UUID `.enc` 跳过计入 `skippedFiles`；`backup-dir` 不存在返回全 0 摘要），清理结果在响应 `orphanCleanSummary`
        字段返回。该自动清理为防御性补偿：恢复本身不落盘 `.enc` 文件，但既有 afterCommit 崩溃残留或 DB 直接删行绕过
        服务留下的孤儿可借此一并清理；清理在恢复成功后于事务内同步执行（`cleanOrphans` 只读 `backup_record` 查
        `file_name` 集合 + 删文件 + best-effort 写既有 `audit_log` 审计），best-effort：清理与审计失败均用 try-catch
        包裹不影响恢复事务提交与响应（恢复已成功，`orphanCleanSummary` 反映尽力清理的结果）。
        passphrase 不参与清理验证（清理即销毁密钥材料）。本端点无需 `X-Confirm-Permanent-Delete` 确认头（恢复非销毁性
        操作，附带清理是 best-effort 防御）；幂等性由 `Idempotency-Key` 保证，重复回放返回首次缓存的完整响应（含
        `orphanCleanSummary`，不重新执行恢复与清理）。恢复联动 `cleanOrphans` 删除的孤儿文件同样按独立孤儿端点语义向
        `audit_log` 追加审计记录（每删一个一条，best-effort，见 `POST /backups/orphans/clean` 描述）。
        恢复成功后对本次提交的 passphrase 在内存做一次强度评估（与创建/武装入口同一算法、同一阈值，详见 §9 强度门槛），
        **仅当评估为弱（score<40）** 时置响应 `passphraseResetRecommended=true`（非阻塞提示，建议用户用强口令新建备份替换；
        系统 无全局 passphrase 可重设，详见状态机）。恢复端点仍豁免强度门槛——评估仅为提示，不拒绝恢复、不返回强度 400
        （passphrase 已与既有备份绑定）。评估在内存进行，passphrase 不落盘、不进日志、不回显；响应仅返回布尔
        `passphraseResetRecommended`，不回显 passphrase 或 score/level 等派生信息；不新增评估端点。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, passphrase]
              properties:
                file:
                  type: string
                  format: binary
                  description: 加密备份 .enc 文件
                passphrase:
                  type: string
                  minLength: 8
                  maxLength: 256
                  description: 仅写入；用于 PBKDF2 派生 AES-256-GCM 解密密钥，永不回显或存储。恢复端点不强制强度门槛（passphrase 已与备份绑定，详见端点描述）
      responses:
        '200':
          description: 恢复结果报告（复用标准数据恢复结果，inserted/skipped/failed 与问题明细）
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportResultReport' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /backups/orphans/clean:
    post:
      tags: [Backups]
      summary: 扫描并清理孤儿 .enc 密文文件（物理删除无 backup_record 对应的落盘文件）
      description: |
        扫描 `jobhub.backup-dir` 下全部 `.enc` 文件，物理删除其中无对应 `backup_record` 行的孤儿文件。
        孤儿来源：单条删除/按龄清理的文件清理在事务 `afterCommit` 回调执行，若进程在 DB 提交后、文件清理前崩溃
        即残留孤儿；或 DB 直接删行绕过服务。判定规则：备份文件名恒为 `<id>.enc`（id 为 UUID），取文件名去
        `.enc` 得 candidate id，**合法 UUID 且** `backup_record` 中无对应 `file_name` 的行即孤儿，删除之；
        非 UUID 命名的 `.enc`（如用户随手放入的无关文件）跳过不删，计入 `skippedFiles`，避免误删。
        本端点不写 `backup_record`、不联动 `backup_schedule.last_backup_id`、不联动删 `data_export`；
        passphrase 不参与清理验证（清理即销毁密钥材料，与单条删除同硬规则）。
        不可恢复，不进入最近删除（`trash_item`）。要求携带 `X-Confirm-Permanent-Delete: true` 确认头
        （缺失或非 `true` 返回 400）防误清。`backup-dir` 不存在时返回 `scannedFiles=0`（不报错）。
        幂等性由 `Idempotency-Key` 保证：重复回放返回首次缓存的相同摘要，不重新执行清理、不产生额外副作用。
        孤儿清理审计日志：每删除一个孤儿文件成功后向既有 `audit_log` 表追加一条记录（仅追加），本版
        不新增查询/展示端点、不回显到响应，事后追溯直接查 `audit_log` 表。审计写入为 best-effort，
        失败仅记日志不阻塞清理、不影响摘要计数。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: X-Confirm-Permanent-Delete
          in: header
          required: true
          schema: { type: boolean, enum: [true] }
      responses:
        '200': { description: 清理摘要, content: { application/json: { schema: { $ref: '#/components/schemas/BackupOrphanCleanSummary' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /data-imports/validate:
    post:
      tags: [DataManagement]
      summary: 数据包冲突预检与恢复预览（不写库）
      description: |
        解析 P0/P1 导出的标准 JSON 数据包，做冲突预检：同 ID 已存在且内容一致的行标记为重复（恢复时跳过），
        同 ID 已存在但内容不同的行标记为冲突（恢复时跳过，保留现状，用户事实优先），
        外键父行（数据库与数据包中均不存在）标记为缺父级（恢复时跳过）。
        该端点只读，不产生任何数据副作用；恢复预览即影响范围展示。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DataImportPackage' } } }
      responses:
        '200': { description: 预检与恢复预览, content: { application/json: { schema: { $ref: '#/components/schemas/ImportValidationReport' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /data-imports/restore:
    post:
      tags: [DataManagement]
      summary: 执行数据恢复（只插入缺失行，不覆盖已有数据）
      description: |
        按预检结果执行恢复：仅插入数据库中缺失的行；重复行、冲突行与缺父级行一律跳过并在结果报告中列出，
        不修改、不覆盖任何已有行。恢复为幂等操作：重复恢复同一数据包时第二次全部标记为“重复跳过”。
        结果报告即恢复结果报告（每表 inserted/skipped/failed 计数与问题明细）。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DataImportPackage' } } }
      responses:
        '200': { description: 恢复结果报告, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResultReport' } } } }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /trash:
    get:
      tags: [DataManagement]
      summary: 查询最近删除
      responses:
        '200': { description: 最近删除列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TrashItem' } } } } }
  /trash/{trashId}/restore:
    parameters: [ { $ref: '#/components/parameters/TrashId' } ]
    post:
      tags: [DataManagement]
      summary: 恢复最近删除记录
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 已恢复, content: { application/json: { schema: { $ref: '#/components/schemas/TrashItem' } } } }
  /trash/{trashId}/permanent:
    parameters: [ { $ref: '#/components/parameters/TrashId' } ]
    delete:
      tags: [DataManagement]
      summary: 永久删除最近删除记录
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Confirm-Permanent-Delete
          in: header
          required: true
          schema: { type: boolean, enum: [true] }
      responses:
        '204': { description: 已永久删除 }
        '422': { $ref: '#/components/responses/BusinessRuleError' }

  /notifications:
    get:
      tags: [Notifications]
      summary: 查询站内通知（最近 100 条，含未读；由到期提醒的调度生成）
      responses:
        '200': { description: 通知列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
  /notifications/{notificationId}:
    parameters: [ { $ref: '#/components/parameters/NotificationId' } ]
    get:
      tags: [Notifications]
      summary: 查询单条通知（含渠道投递状态）
      responses:
        '200': { description: 通知详情, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/{notificationId}/read:
    parameters: [ { $ref: '#/components/parameters/NotificationId' } ]
    post:
      tags: [Notifications]
      summary: 标记通知已读（重复调用幂等，返回当前状态）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 通知当前状态, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/{notificationId}/channel-deliveries/{channelType}/ack:
    parameters:
      - { $ref: '#/components/parameters/NotificationId' }
      - { $ref: '#/components/parameters/ChannelType' }
    post:
      tags: [Notifications]
      summary: 浏览器通知渠道投递回执（前端展示系统通知后调用；幂等，仅 BROWSER）
      description: 将该通知的 BROWSER 渠道投递标记为 SENT；不存在时创建 SENT 记录。EMAIL 与 WEBHOOK 渠道返回 422。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '204': { description: 已回执（幂等） }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /notification-channels:
    get:
      tags: [Notifications]
      summary: 查询所有通知渠道配置（含未配置渠道的默认禁用与版本 0）
      responses:
        '200': { description: 渠道配置列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } } } } }
  /notification-channels/{channelType}:
    parameters: [ { $ref: '#/components/parameters/ChannelType' } ]
    get:
      tags: [Notifications]
      summary: 查询通知渠道配置（未配置的渠道返回默认禁用与版本 0）
      responses:
        '200': { description: 渠道配置, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannel' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Notifications]
      summary: 更新通知渠道（启用/禁用与配置；首次保存以 0 作为 If-Match-Version）
      description: |
        启用 EMAIL 渠道时必须已有 smtpHost 与 toAddress（请求或既有配置中）。
        启用 WEBHOOK 渠道时必须已有 webhookUrl（请求或既有配置中）。
        password 与 webhook secret 仅写入不回显：请求中省略或为 null 表示保留既有凭据；是否已设置凭据见 hasCredential。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannelUpdateRequest' } } }
      responses:
        '200': { description: 渠道配置已更新, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannel' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /notification-channels/{channelType}/test:
    parameters: [ { $ref: '#/components/parameters/ChannelType' } ]
    post:
      tags: [Notifications]
      summary: 发送测试通知（站内通知始终创建；EMAIL/WEBHOOK 同步投递并返回结果，BROWSER 由前端展示后回执）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 测试结果, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelTestResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /ai-providers:
    get:
