    post:
      tags: [Ai]
      summary: 新增 AI 供应商配置
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiProviderCreateRequest' } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/AiProvider' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /ai-providers/{providerId}:
    parameters: [ { $ref: '#/components/parameters/AiProviderId' } ]
    get:
      tags: [Ai]
      summary: 查询单个供应商配置
      responses:
        '200': { description: 供应商配置, content: { application/json: { schema: { $ref: '#/components/schemas/AiProvider' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Ai]
      summary: 更新供应商配置（api_key 省略表示保留既有凭据）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiProviderCreateRequest' } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/AiProvider' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
    delete:
      tags: [Ai]
      summary: 删除供应商配置（不可恢复，不进入最近删除）
      description: |
        只有非激活且未被 ai_job.provider_id 引用的供应商可以删除，删除必须携带当前版本。
        激活中的供应商必须先切换到其他供应商；已有任务引用的供应商必须保留以维持任务审计与失败重试所需的配置关联。
        版本冲突、业务规则拒绝或幂等冲突均不得产生部分删除。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      responses:
        '204': { description: 已删除 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /ai-providers/{providerId}/activate:
    parameters: [ { $ref: '#/components/parameters/AiProviderId' } ]
    post:
      tags: [Ai]
      summary: 切换激活供应商（同一时刻仅一个激活；新任务使用激活供应商）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 已切换, content: { application/json: { schema: { $ref: '#/components/schemas/AiProvider' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-providers/{providerId}/test:
    parameters: [ { $ref: '#/components/parameters/AiProviderId' } ]
    post:
      tags: [Ai]
      summary: 连通性测试（发送一条最小补全请求，返回延迟与结果）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 测试结果, content: { application/json: { schema: { $ref: '#/components/schemas/AiProviderTestResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-jobs:
    post:
      tags: [Ai]
      summary: 创建 AI 异步任务（岗位 JD 提取或简历草稿）
      description: |
        任务入队后由后台执行器调用激活供应商完成；重新生成即再创建新任务，
        既有任务的候选条目与确认状态不受影响（PRD 9.2：重新生成不得覆盖已确认内容）。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiJobCreateRequest' } } }
      responses:
        '202': { description: 任务已入队, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /interview-questions/{questionId}/ai-classification:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [Ai]
      summary: 为面试问题创建 AI 分类任务
      description: 只保存问题内容快照并异步生成可编辑候选分类；不会自动修改问题类型。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: 任务已入队, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /interview-questions/{questionId}/ai-answer-analysis:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [Ai]
      summary: 为面试回答创建 AI 质量分析任务
      description: 只快照问题、用户回答与现有参考答案并生成可编辑候选；不会自动修改任何问题字段。我的回答为空时返回 422。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: 任务已入队, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /interview-questions/{questionId}/ai-task-suggestion:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [Ai]
      summary: 为薄弱面试问题创建 AI 学习任务建议
      description: 只快照问题、回答状态、改进信息和已有知识点；异步生成一个可编辑任务候选，不会自动创建学习任务。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: 任务已入队, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleError' }
  /interview-questions/{questionId}/ai-jobs:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    get:
      tags: [Ai]
      summary: 按类型查询面试问题的 AI 任务历史
      parameters:
        - name: jobType
          in: query
          required: false
          schema: { type: string, enum: [QUESTION_CLASSIFICATION, ANSWER_QUALITY_ANALYSIS, TASK_SUGGESTION], default: QUESTION_CLASSIFICATION }
      responses:
        '200': { description: 任务列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AiJob' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-jobs/{aiJobId}:
    parameters: [ { $ref: '#/components/parameters/AiJobId' } ]
    get:
      tags: [Ai]
      summary: 查询任务（含候选条目）
      responses:
        '200': { description: 任务详情, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-jobs/{aiJobId}/cancel:
    parameters: [ { $ref: '#/components/parameters/AiJobId' } ]
    post:
      tags: [Ai]
      summary: 取消任务（QUEUED/RUNNING → CANCELED；已完成任务返回 422）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 任务当前状态, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /ai-jobs/{aiJobId}/retry:
    parameters: [ { $ref: '#/components/parameters/AiJobId' } ]
    post:
      tags: [Ai]
      summary: 重试失败任务（FAILED → QUEUED，attempt_count + 1，上限 3）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 任务已重新入队, content: { application/json: { schema: { $ref: '#/components/schemas/AiJob' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /jobs/{jobId}/ai-jobs:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Ai]
      summary: 查询岗位的 AI 任务历史（最新优先）
      responses:
        '200': { description: 任务列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AiJob' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-job-items/{itemId}/accept:
    parameters: [ { $ref: '#/components/parameters/AiJobItemId' } ]
    post:
      tags: [Ai]
      summary: 采纳 AI 候选条目（可携带编辑后的内容）
      description: JD 提取条目会创建 source_type=AI 的 PENDING 岗位要求；问题分类和回答质量分析条目需要携带问题当前版本，采纳后只更新各自声明的字段。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersionOptional' } ]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/AiJobItemAcceptRequest' } } }
      responses:
        '200': { description: 已采纳, content: { application/json: { schema: { $ref: '#/components/schemas/AiJobItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /ai-job-items/{itemId}/reject:
    parameters: [ { $ref: '#/components/parameters/AiJobItemId' } ]
    post:
      tags: [Ai]
      summary: 拒绝候选要求（PROPOSED → REJECTED，幂等）
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: 已拒绝, content: { application/json: { schema: { $ref: '#/components/schemas/AiJobItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/IllegalTransition' }
  /mock-interviews:
    post:
      tags: [Ai]
      summary: 从项目案例启动模拟面试并异步生成讲解稿和首个追问
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewCreateRequest' } } } }
      responses: { '202': { description: 会话已创建, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewSession' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /resume-versions:
    get:
      tags: [Resume]
      summary: 查询本地保存的简历版本（最新优先）
      responses: { '200': { description: 简历版本, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ResumeVersion' } } } } } }
    post:
      tags: [Resume]
      summary: 保存一个人工确认的简历版本
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResumeVersionCreateRequest' } } } }
      responses: { '201': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/ResumeVersion' } } } }, '400': { $ref: '#/components/responses/ValidationError' } }
  /resume-versions/compare:
    get:
      tags: [Resume]
      summary: 对比两个不同简历版本的非空文本行
      parameters: [ { name: leftId, in: query, required: true, schema: { type: string, format: uuid } }, { name: rightId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: 逐行对比, content: { application/json: { schema: { $ref: '#/components/schemas/ResumeVersionComparison' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/BusinessRuleError' } }
  /mock-interviews/evaluation-summary:
    get:
      tags: [Ai]
      summary: 查询所有已完成模拟面试作答评分的只读统计；不推断能力或趋势
      responses: { '200': { description: 评分统计, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewEvaluationSummary' } } } } }
  /mock-interviews/evaluation-trend:
    get:
      tags: [Ai]
      summary: 对比两个模拟面试评分时间窗口的原始练习数据
      description: 两个窗口各自至少有两条评分时才计算平均分与平均分差；差值只描述原始练习评分的算术变化，不代表能力等级，也不会创建任务或修改用户事实。
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: compareFrom, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: compareTo, in: query, required: true, schema: { type: string, format: date-time } }
      responses: { '200': { description: 评分窗口对比, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewEvaluationTrend' } } } }, '400': { $ref: '#/components/responses/ValidationError' } }
  /mock-interviews/{mockInterviewId}:
    parameters: [ { $ref: '#/components/parameters/MockInterviewId' } ]
    get:
      tags: [Ai]
      summary: 查询模拟面试会话；首轮 AI 生成完成时持久化讲解稿和追问并激活会话
      responses: { '200': { description: 会话, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewSession' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /mock-interviews/{mockInterviewId}/turns:
    parameters: [ { $ref: '#/components/parameters/MockInterviewId' } ]
    get:
      tags: [Ai]
      summary: 查询已保存的模拟面试轮次
      responses: { '200': { description: 轮次, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MockInterviewTurn' } } } } } }
  /mock-interviews/{mockInterviewId}/answers:
    parameters: [ { $ref: '#/components/parameters/MockInterviewId' } ]
    post:
      tags: [Ai]
      summary: 保存用户对当前追问的作答，并异步生成下一道追问；不评分
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewAnswerRequest' } } } }
      responses: { '202': { description: 作答已保存且连续追问任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewSession' } } } }, '409': { $ref: '#/components/responses/VersionConflict' }, '422': { $ref: '#/components/responses/IllegalTransition' } }
  /mock-interviews/{mockInterviewId}/turns/{turnId}/evaluation:
    parameters: [ { $ref: '#/components/parameters/MockInterviewId' }, { $ref: '#/components/parameters/MockInterviewTurnId' } ]
    post:
      tags: [Ai]
      summary: 异步生成一条用户模拟面试作答的练习评分；不修改用户事实或创建任务
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      responses: { '202': { description: 评分任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewSession' } } } }, '409': { $ref: '#/components/responses/VersionConflict' }, '422': { $ref: '#/components/responses/IllegalTransition' } }
  /mock-interviews/{mockInterviewId}/transition:
    parameters: [ { $ref: '#/components/parameters/MockInterviewId' } ]
    post:
      tags: [Ai]
      summary: 结束或取消模拟面试
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewTransitionRequest' } } } }
      responses: { '200': { description: 状态已更新, content: { application/json: { schema: { $ref: '#/components/schemas/MockInterviewSession' } } } }, '422': { $ref: '#/components/responses/IllegalTransition' } }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema: { type: integer, minimum: 0 }
    IfMatchVersionOptional:
      name: If-Match-Version
      in: header
      required: false
      schema: { type: integer, minimum: 0 }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    RequirementId: { name: requirementId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    InterviewId: { name: interviewId, in: path, required: true, schema: { type: string, format: uuid } }
    ReminderId: { name: reminderId, in: path, required: true, schema: { type: string, format: uuid } }
    ReviewId: { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
    QuestionId: { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    SkillId: { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
    EvidenceId: { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
    EvidenceAttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    BackupId: { name: backupId, in: path, required: true, schema: { type: string, format: uuid } }
    TrashId: { name: trashId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    ChannelType: { name: channelType, in: path, required: true, schema: { type: string, enum: [BROWSER, EMAIL, WEBHOOK] } }
    AiProviderId: { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
    AiJobId: { name: aiJobId, in: path, required: true, schema: { type: string, format: uuid } }
    AiJobItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    MockInterviewId: { name: mockInterviewId, in: path, required: true, schema: { type: string, format: uuid } }
    MockInterviewTurnId: { name: turnId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    NotFound:
      description: 资源不存在或不可见
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: 请求字段校验失败
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    VersionConflict:
      description: 版本冲突
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IdempotencyConflict:
      description: 幂等键与既有请求不一致
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    DuplicateApplication:
      description: 已有同岗位有效投递，需显式确认二次投递
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IllegalTransition:
      description: 非法状态转换
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BusinessRuleError:
      description: 业务规则不满足
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string, example: ILLEGAL_STATE_TRANSITION }
        message: { type: string, example: 当前状态不允许转换为目标状态 }
        traceId: { type: string }
        fieldErrors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        currentState: { type: string }
        targetState: { type: string }
        reason: { type: string }
    FieldError:
      type: object
      required: [field, message]
      properties: { field: { type: string }, message: { type: string } }
    DashboardOverview:
      type: object
      required: [actionItems, upcomingInterviews, activeApplications, weakKnowledgePoints, recentJobs]
      properties:
        actionItems: { type: array, items: { $ref: '#/components/schemas/ActionItem' } }
        upcomingInterviews: { type: array, items: { $ref: '#/components/schemas/Interview' } }
        activeApplications: { type: array, items: { $ref: '#/components/schemas/Application' } }
        weakKnowledgePoints: { type: array, items: { $ref: '#/components/schemas/WeakKnowledgePoint' } }
        recentJobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    ActionItem:
      type: object
      required: [id, type, title, priority, sourceRef]
      properties:
        id: { type: string }
        type: { type: string, enum: [UPCOMING_INTERVIEW, REVIEW_DUE, APPLICATION_ACTION_DUE, TASK_DUE] }
        title: { type: string }
        dueAt: { type: string, format: date-time, nullable: true }
        priority: { type: integer, minimum: 1 }
        sourceRef: { $ref: '#/components/schemas/SourceRef' }
    JobStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    JobDecisionStatus: { type: string, nullable: true, enum: [TO_APPLY, APPLY, DEFER, IGNORE] }
    RequirementConfirmationStatus: { type: string, enum: [PENDING, CONFIRMED, IGNORED] }
    RequirementType: { type: string, enum: [MUST, BONUS, RESPONSIBILITY, EXPERIENCE, DOMAIN, TO_CONFIRM] }
    GapStatus: { type: string, enum: [SATISFIED_WITH_EVIDENCE, SELF_REPORTED_NO_EVIDENCE, NOT_MET, INSUFFICIENT_INFO, PENDING_CONFIRMATION] }
    ApplicationStatus: { type: string, enum: [DRAFT, APPLIED, RESUME_PASSED, INTERVIEWING, OFFER, REJECTED, WITHDRAWN, ON_HOLD] }
    InterviewScheduleStatus: { type: string, enum: [SCHEDULED, COMPLETED, CANCELED, NO_SHOW] }
    InterviewResult: { type: string, enum: [PENDING, PASSED, FAILED] }
    ReminderStatus: { type: string, enum: [PENDING, PROCESSING, SENT, FAILED, CANCELED] }
    ReviewStatus: { type: string, enum: [NOT_STARTED, DRAFT, COMPLETED] }
    AnswerStatus: { type: string, enum: [FULLY_ANSWERED, PARTIALLY_ANSWERED, UNANSWERED] }
    TaskStatus: { type: string, enum: [TODO, IN_PROGRESS, COMPLETED, ABANDONED] }
    TaskSourceType: { type: string, enum: [QUESTION, JOB, JOB_REQUIREMENT, SKILL, KNOWLEDGE_POINT, MANUAL] }
    EvidenceStatus: { type: string, enum: [NO_EVIDENCE, WEAK, VALID] }
    JobCreateRequest:
      type: object
      required: [companyName, title, jdRawText]
      properties:
        companyName: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 150 }
        jdRawText: { type: string, minLength: 20, maxLength: 50000 }
        source: { type: string, maxLength: 100 }
        sourceUrl: { type: string, format: uri, nullable: true }
        location: { type: string, maxLength: 100 }
        salaryRange: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 5000 }
    JobUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/JobCreateRequest'
        - type: object
          properties:
            decisionStatus: { $ref: '#/components/schemas/JobDecisionStatus' }
            decisionReason: { type: string, maxLength: 1000, nullable: true }
    Job:
      type: object
      required: [id, companyName, title, jdRawText, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        title: { type: string }
        jdRawText: { type: string }
        source: { type: string, nullable: true }
        sourceUrl: { type: string, format: uri, nullable: true }
        location: { type: string, nullable: true }
        salaryRange: { type: string, nullable: true }
        decisionStatus: { $ref: '#/components/schemas/JobDecisionStatus' }
        decisionReason: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/JobStatus' }
        notes: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobListItem:
      type: object
      required: [job, confirmedRequirementCount, pendingRequirementCount, gapOverview, hasActiveApplication]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        confirmedRequirementCount: { type: integer }
        pendingRequirementCount: { type: integer }
        gapOverview: { type: string, description: 已确认要求的当前差距统计；无资料时明确说明信息不足。 }
        hasActiveApplication: { type: boolean }
    JobRequirement:
      type: object
      required: [id, jobId, rawText, type, confirmationStatus, version]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        rawText: { type: string }
        normalizedName: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/RequirementType' }
        proficiencyText: { type: string, nullable: true }
        confirmationStatus: { $ref: '#/components/schemas/RequirementConfirmationStatus' }
        source: { type: string, enum: [RULE, USER, AI], default: RULE }
        sortOrder: { type: integer, nullable: true, description: 提取/展示排序序号。 }
        version: { type: integer }
    RequirementUpdateRequest:
      type: object
      required: [confirmationStatus]
      properties:
        rawText: { type: string, maxLength: 2000 }
        normalizedName: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/RequirementType' }
        proficiencyText: { type: string, maxLength: 500 }
        confirmationStatus: { $ref: '#/components/schemas/RequirementConfirmationStatus' }
        reason: { type: string, maxLength: 1000, description: 人工修正匹配状态时的原因；与 manualMatchStatus 配合使用。 }
        manualMatchStatus:
          $ref: '#/components/schemas/GapStatus'
          description: 可选。用户提供后，对应要求的 requirement_match 将被人工修正为此状态；reason 字段作为修正原因保留。原计算依据通过 evidence_snapshot_json 保留（AT-04）。
    RequirementMergeRequest:
      type: object
      required: [targetRequirementId, sourceRequirementIds]
      properties:
        targetRequirementId: { type: string, format: uuid }
        sourceRequirementIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
    MatchReport:
      type: object
      required: [id, jobId, ruleVersion, weights, generatedAt, mustSummary, bonusSummary, mustScore, bonusScore, suggestion, requirements, stale]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        ruleVersion: { type: string, example: MATCH_RULE_V1 }
        weights: { type: object, additionalProperties: { type: integer }, description: 需求类型权重，如 MUST=3、BONUS=1 }
        generatedAt: { type: string, format: date-time }
        mustSummary: { $ref: '#/components/schemas/MatchStatusSummary' }
        bonusSummary: { $ref: '#/components/schemas/MatchStatusSummary' }
        mustScore: { $ref: '#/components/schemas/MatchScoreBreakdown' }
        bonusScore: { $ref: '#/components/schemas/MatchScoreBreakdown' }
        suggestion:
          type: object
          required: [type, reasons]
          properties:
            type: { type: string, enum: [STRONG_MATCH, PARTIAL_MATCH, LOW_MATCH, NEED_MORE_INFO] }
            reasons: { type: array, items: { type: string }, description: 投递建议理由，不自动替用户做决定 }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/MatchReportItem' }
        stale: { type: boolean, description: 生成后岗位要求或用户资料变化时为 true，报告可能过期，建议重新生成 }
    MatchStatusSummary:
      type: object
      required: [total, satisfiedWithEvidence, selfReportedNoEvidence, notMet, insufficientInfo]
      properties:
        total: { type: integer }
        satisfiedWithEvidence: { type: integer }
        selfReportedNoEvidence: { type: integer }
        notMet: { type: integer }
        insufficientInfo: { type: integer }
    MatchScoreBreakdown:
      type: object
      required: [numerator, denominator, weight]
      properties:
        numerator: { type: number, description: 加权得分（满足=1，自报无证据=0.5，未满足=0） }
        denominator: { type: number, description: 加权分母；缺少资料的要求不计入分母（不按零分处理） }
        weight: { type: integer }
    MatchReportItem:
      type: object
      required: [requirementId, rawText, type, status, reasons]
      properties:
        requirementId: { type: string, format: uuid }
        normalizedName: { type: string, nullable: true }
        rawText: { type: string }
        type: { type: string }
        status: { type: string, enum: [SATISFIED_WITH_EVIDENCE, SELF_REPORTED_NO_EVIDENCE, NOT_MET, INSUFFICIENT_INFO, PENDING_CONFIRMATION] }
        reasons: { type: array, items: { type: string } }
    RequirementExtractionResult:
      type: object
      required: [jobId, extractedAt, candidates]
      properties:
        jobId: { type: string, format: uuid }
        extractedAt: { type: string, format: date-time }
        candidates: { type: array, items: { $ref: '#/components/schemas/JobRequirement' } }
        newCount: { type: integer, description: 本次提取新增候选数（去重后）。 }
    GapItem:
      type: object
      required: [requirement, status, evidence]
      properties:
        requirement: { $ref: '#/components/schemas/JobRequirement' }
        status: { $ref: '#/components/schemas/GapStatus' }
        evidence:
          type: array
          description: 用于本项结论的用户事实；可为空。
          items: { $ref: '#/components/schemas/EvidenceReference' }
        manualOverrideReason: { type: string, nullable: true }
    ApplicationCreateRequest:
      type: object
      required: [jobId, appliedAt, channel]
      properties:
        jobId: { type: string, format: uuid }
        appliedAt: { type: string, format: date }
        channel: { type: string, maxLength: 100 }
        resumeVersion: { type: string, maxLength: 200 }
        expectedSalary: { type: string, maxLength: 100 }
        contact: { type: string, maxLength: 200 }
        nextAction: { type: string, maxLength: 500 }
        nextActionDueAt: { type: string, format: date-time }
        allowDuplicate:
          type: boolean
          default: false
          description: 明确确认创建同岗位的第二条活动投递；未确认时重复创建返回 DUPLICATE_APPLICATION。
        notes: { type: string, maxLength: 5000 }
    ApplicationUpdateRequest:
      type: object
      properties:
        channel: { type: string, maxLength: 100 }
        resumeVersion: { type: string, maxLength: 200 }
        expectedSalary: { type: string, maxLength: 100 }
        contact: { type: string, maxLength: 200 }
        nextAction: { type: string, maxLength: 500, nullable: true }
        nextActionDueAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, maxLength: 1000, nullable: true }
        notes: { type: string, maxLength: 5000 }
    ApplicationTransitionRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus: { $ref: '#/components/schemas/ApplicationStatus' }
        reason: { type: string, maxLength: 1000 }
        allowOfferWithoutCompletedInterview: { type: boolean, default: false }
    Application:
      type: object
      required: [id, jobId, status, appliedAt, channel, version]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        previousActiveStatus: { $ref: '#/components/schemas/ApplicationStatus', nullable: true }
        appliedAt: { type: string, format: date }
        channel: { type: string }
        resumeVersion: { type: string, nullable: true }
        expectedSalary: { type: string, nullable: true }
        contact: { type: string, nullable: true }
        nextAction: { type: string, nullable: true }
        nextActionDueAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        version: { type: integer }
    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          properties:
            job: { $ref: '#/components/schemas/Job' }
            statusHistory: { type: array, items: { $ref: '#/components/schemas/StatusLog' } }
            interviews: { type: array, items: { $ref: '#/components/schemas/Interview' } }
    StatusLog:
      type: object
      required: [id, fromStatus, toStatus, occurredAt]
      properties:
        id: { type: string, format: uuid }
        fromStatus: { $ref: '#/components/schemas/ApplicationStatus' }
        toStatus: { $ref: '#/components/schemas/ApplicationStatus' }
        reason: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    InterviewCreateRequest:
      type: object
      required: [applicationId, roundName, startsAt, eventTimeZone]
      properties:
        applicationId: { type: string, format: uuid }
        roundName: { type: string, maxLength: 100 }
        startsAt: { type: string, format: date-time, description: UTC instant }
        eventTimeZone: { type: string, example: Asia/Shanghai }
        mode: { type: string, enum: [ONLINE, ONSITE, PHONE] }
        meetingUrlOrAddress: { type: string, maxLength: 2000 }
        contact: { type: string, maxLength: 200 }
        preparationChecklist: { type: array, items: { type: string, maxLength: 300 } }
        notes: { type: string, maxLength: 5000 }
    InterviewUpdateRequest:
      type: object
      properties:
        roundName: { type: string, maxLength: 100 }
        mode: { type: string, enum: [ONLINE, ONSITE, PHONE] }
        meetingUrlOrAddress: { type: string, maxLength: 2000 }
        contact: { type: string, maxLength: 200 }
        preparationChecklist: { type: array, items: { type: string, maxLength: 300 } }
        notes: { type: string, maxLength: 5000 }
        result: { $ref: '#/components/schemas/InterviewResult' }
    InterviewCompleteRequest:
      type: object
      properties:
        result: { $ref: '#/components/schemas/InterviewResult' }
        note: { type: string, maxLength: 1000 }
    InterviewRescheduleRequest:
      type: object
      required: [startsAt, eventTimeZone]
      properties:
        startsAt: { type: string, format: date-time }
        eventTimeZone: { type: string }
        reason: { type: string, maxLength: 1000 }
    ReasonRequest:
      type: object
      properties: { reason: { type: string, maxLength: 1000 } }
    Interview:
      type: object
      required: [id, applicationId, roundName, startsAt, eventTimeZone, scheduleStatus, result, version]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        roundName: { type: string }
        startsAt: { type: string, format: date-time }
        eventTimeZone: { type: string }
        mode: { type: string, enum: [ONLINE, ONSITE, PHONE], nullable: true }
        meetingUrlOrAddress: { type: string, nullable: true }
        contact: { type: string, nullable: true }
        scheduleStatus: { $ref: '#/components/schemas/InterviewScheduleStatus' }
        result: { $ref: '#/components/schemas/InterviewResult' }
        preparationChecklist: { type: array, items: { type: string } }
        notes: { type: string, nullable: true }
        version: { type: integer }
    InterviewDetail:
      allOf:
        - $ref: '#/components/schemas/Interview'
        - type: object
          properties:
            application: { $ref: '#/components/schemas/Application' }
            reviewStatus: { $ref: '#/components/schemas/ReviewStatus' }
            reminders: { type: array, items: { $ref: '#/components/schemas/Reminder' } }
    InterviewListItem:
      allOf:
        - $ref: '#/components/schemas/Interview'
        - type: object
          required: [application]
          properties:
            application: { $ref: '#/components/schemas/InterviewApplicationSummary' }
    InterviewApplicationSummary:
      type: object
      required: [id, jobId, status, companyName, jobTitle]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        companyName: { type: string }
        jobTitle: { type: string }
    Reminder:
      type: object
      required: [id, interviewId, reminderType, scheduledAt, status, attemptCount, version]
      properties:
        id: { type: string, format: uuid }
        interviewId: { type: string, format: uuid }
        reminderType: { type: string, enum: [ONE_DAY, TWO_HOURS, THIRTY_MINUTES, CUSTOM] }
        scheduledAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ReminderStatus' }
        failureReason: { type: string, nullable: true }
        attemptCount: { type: integer, minimum: 0, description: 调度尝试次数 }
        version: { type: integer }
    ReminderCreateRequest:
      type: object
      required: [reminderType, scheduledAt]
      properties:
        reminderType: { type: string, enum: [ONE_DAY, TWO_HOURS, THIRTY_MINUTES, CUSTOM] }
        scheduledAt: { type: string, format: date-time }
    ReminderUpdateRequest:
      type: object
      properties:
        scheduledAt: { type: string, format: date-time }
        enabled: { type: boolean }
    PreparationPack:
      type: object
      required: [interview, prioritizedItems, requirements, projectCases, historicalQuestions, openTasks]
      properties:
        interview: { $ref: '#/components/schemas/Interview' }
        prioritizedItems: { type: array, items: { $ref: '#/components/schemas/PreparationItem' } }
        requirements: { type: array, items: { $ref: '#/components/schemas/GapItem' } }
        projectCases: { type: array, items: { $ref: '#/components/schemas/ProjectCaseSummary' } }
        historicalQuestions: { type: array, items: { $ref: '#/components/schemas/InterviewQuestion' } }
        openTasks: { type: array, items: { $ref: '#/components/schemas/LearningTask' } }
        checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
    PreparationItem:
      type: object
      required: [type, title, priority, reasons, sourceRefs]
      properties:
        type: { type: string, enum: [REQUIREMENT, PROJECT_CASE, QUESTION, TASK, CHECKLIST] }
        title: { type: string }
        priority: { type: integer, minimum: 1 }
        reasons: { type: array, minItems: 1, items: { type: string } }
        sourceRefs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
    ChecklistItem:
      type: object
      required: [id, text, completed]
      properties: { id: { type: string }, text: { type: string }, completed: { type: boolean } }
    ChecklistUpdateRequest:
      type: object
      required: [completed]
      properties:
        completed: { type: boolean }
    SourceRef:
      type: object
      required: [type, id, label]
      properties: { type: { type: string }, id: { type: string, format: uuid }, label: { type: string } }
    InterviewReview:
      type: object
      required: [id, interviewId, status, noQuestionsRecorded, version]
      properties:
        id: { type: string, format: uuid }
        interviewId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        interviewResult: { $ref: '#/components/schemas/InterviewResult', nullable: true }
        noQuestionsRecorded: { type: boolean }
        overallFeeling: { type: string, nullable: true }
        interviewerFocus: { type: string, nullable: true }
        jobInterest: { type: string, nullable: true }
        projectExpressRisk:
          type: string
          nullable: true
          description: 项目表达与真实性风险备注（完整复盘附加字段）
        version: { type: integer }
        lastModifiedAt: { type: string, format: date-time }
        questions: { type: array, items: { $ref: '#/components/schemas/InterviewQuestion' } }
    ReviewUpsertRequest:
      type: object
      properties:
        interviewResult: { $ref: '#/components/schemas/InterviewResult' }
        noQuestionsRecorded: { type: boolean }
        overallFeeling: { type: string, maxLength: 5000 }
        interviewerFocus: { type: string, maxLength: 5000 }
        jobInterest: { type: string, maxLength: 1000 }
        projectExpressRisk: { type: string, maxLength: 5000 }
    QuestionCreateRequest:
      type: object
      required: [content, answerStatus]
      properties:
        content: { type: string, maxLength: 10000 }
        answerStatus: { $ref: '#/components/schemas/AnswerStatus' }
        type: { type: string, maxLength: 100 }
        knowledgePointIds: { type: array, items: { type: string, format: uuid } }
    QuestionUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/QuestionCreateRequest'
        - type: object
          properties:
            myAnswer: { type: string, maxLength: 20000 }
            referenceAnswer: { type: string, maxLength: 20000 }
            difficulty: { type: integer, minimum: 1, maximum: 5 }
            errorReason: { type: string, maxLength: 5000 }
            improvementPlan: { type: string, maxLength: 5000 }
    InterviewQuestion:
      type: object
      required: [id, reviewId, content, answerStatus, version]
      properties:
        id: { type: string, format: uuid }
        reviewId: { type: string, format: uuid }
        content: { type: string }
        answerStatus: { $ref: '#/components/schemas/AnswerStatus' }
        type: { type: string, nullable: true }
        myAnswer: { type: string, nullable: true }
        referenceAnswer: { type: string, nullable: true }
        difficulty: { type: integer, nullable: true }
        errorReason: { type: string, nullable: true }
        improvementPlan: { type: string, nullable: true }
        knowledgePoints: { type: array, items: { $ref: '#/components/schemas/KnowledgePoint' } }
        version: { type: integer }
    CreateTaskFromQuestionRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [CREATE_NEW, LINK_EXISTING] }
        existingTaskId: { type: string, format: uuid, nullable: true }
        title: { type: string, maxLength: 200 }
        dueAt: { type: string, format: date-time }
        acceptanceCriteria: { type: string, maxLength: 5000 }
        verificationMethod: { type: string, maxLength: 1000 }
    KnowledgePoint:
      type: object
      required: [id, name]
      properties: { id: { type: string, format: uuid }, name: { type: string }, category: { type: string, nullable: true } }
    KnowledgePointCreateRequest:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 100 }, category: { type: string, maxLength: 100 } }
    WeakKnowledgePoint:
      type: object
      required: [knowledgePoint, weightedWeaknessCount, questionCount, questions]
      properties:
        knowledgePoint: { $ref: '#/components/schemas/KnowledgePoint' }
        weightedWeaknessCount: { type: number, format: float, example: 2.5 }
        questionCount: { type: integer }
        questions: { type: array, items: { $ref: '#/components/schemas/InterviewQuestion' } }
    ReviewAnalysis:
      type: object
      required: [timeRange, reviewCount, questionStats, knowledgePointStats, questionTypeStats, interviewResultSummary, weakPointComparison, answerStatusComparison]
      properties:
        timeRange:
          type: object
          required: [from, to]
          description: 统计时间范围（按面试开始日期过滤，回显请求参数；未传表示全时段）
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date, nullable: true }
        reviewCount:
          type: integer
          description: 参与统计的复盘数（含草稿与已完成，按面试开始日期与岗位过滤）
        questionStats: { $ref: '#/components/schemas/ReviewQuestionStats' }
        knowledgePointStats:
          type: array
          description: 按知识点聚合的问题表现（仅包含有关联问题的知识点）
          items: { $ref: '#/components/schemas/ReviewKnowledgePointStat' }
        questionTypeStats:
          type: array
          description: 按问题类型聚合（type 为 null 表示未填写类型）
          items: { $ref: '#/components/schemas/ReviewQuestionTypeStat' }
        interviewResultSummary: { $ref: '#/components/schemas/ReviewInterviewResultSummary' }
        weakPointComparison:
          allOf:
            - $ref: '#/components/schemas/WeakPointComparison'
          nullable: true
          description: 可选的两个时间窗口薄弱点对比；未提供 compareFrom/compareTo 时为 null。
        answerStatusComparison:
          allOf: [ { $ref: '#/components/schemas/AnswerStatusComparison' } ]
          nullable: true
          description: 可选的两个时间窗口原始回答状态计数；仅在同时提供 compareFrom 和 compareTo 时返回。
    AnswerStatusComparison:
      type: object
      required: [compareTimeRange, currentTotalCount, compareTotalCount, currentFullyAnsweredCount, compareFullyAnsweredCount, currentPartiallyAnsweredCount, comparePartiallyAnsweredCount, currentUnansweredCount, compareUnansweredCount]
      properties:
        compareTimeRange:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date, nullable: true }
        currentTotalCount: { type: integer }
        compareTotalCount: { type: integer }
        currentFullyAnsweredCount: { type: integer }
        compareFullyAnsweredCount: { type: integer }
        currentPartiallyAnsweredCount: { type: integer }
        comparePartiallyAnsweredCount: { type: integer }
        currentUnansweredCount: { type: integer }
        compareUnansweredCount: { type: integer }
    WeakPointComparison:
      type: object
      required: [compareTimeRange, items]
      properties:
        compareTimeRange:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/WeakPointComparisonItem' }
    WeakPointComparisonItem:
      type: object
      required: [knowledgePoint, currentWeightedWeaknessCount, compareWeightedWeaknessCount, delta, currentQuestionCount, compareQuestionCount]
      properties:
        knowledgePoint: { $ref: '#/components/schemas/KnowledgePoint' }
        currentWeightedWeaknessCount: { type: number, format: float }
        compareWeightedWeaknessCount: { type: number, format: float }
        delta: { type: number, format: float, description: 当前窗口减去对比窗口；负数表示薄弱次数下降 }
        currentQuestionCount: { type: integer }
        compareQuestionCount: { type: integer }
    RateFraction:
      type: object
      required: [numerator, denominator]
      description: 可解释分数片段；denominator 为 0 表示无样本，不得渲染为百分比
      properties:
        numerator: { type: integer }
        denominator: { type: integer }
    ChannelEffectivenessReport:
      type: object
      required: [from, to, channelGroups, resumeVersionGroups]
      description: 投递渠道与简历版本效果原始计数聚合；只读，不输出趋势结论、能力等级、归因或行动建议
      properties:
        from: { type: string, format: date, nullable: true, description: 起始日期（按 applied_at 日期过滤），null 表示不限 }
        to: { type: string, format: date, nullable: true, description: 结束日期，null 表示不限 }
        channelGroups:
          type: array
          description: 按投递渠道（application_record.channel 原始填写文本）分组的原始计数
          items: { $ref: '#/components/schemas/ChannelEffectivenessGroup' }
        resumeVersionGroups:
          type: array
          description: 按简历版本（application_record.resume_version 原始填写文本）分组的原始计数；未填写版本的投递归入 resumeVersion 为 null 的组
          items: { $ref: '#/components/schemas/ResumeVersionEffectivenessGroup' }
    ChannelEffectivenessGroup:
      type: object
      required: [channel, applicationCount, interviewCount, offerCount, offerRate]
      properties:
        channel: { type: string, description: 投递渠道原始填写文本 }
        applicationCount: { type: integer, description: 已投递数（status != DRAFT 且未软删） }
        interviewCount: { type: integer, description: 已进入面试阶段数（status IN INTERVIEWING, OFFER） }
        offerCount: { type: integer, description: 已拿 Offer 数（status = OFFER） }
        offerRate: { type: number, format: float, nullable: true, description: Offer 率 = offerCount / applicationCount；applicationCount < 2 时为 null（信息不足） }
    ResumeVersionEffectivenessGroup:
      type: object
      required: [resumeVersion, applicationCount, interviewCount, offerCount, offerRate]
      properties:
        resumeVersion: { type: string, nullable: true, description: 简历版本原始填写文本；null 表示未指定版本 }
        applicationCount: { type: integer }
        interviewCount: { type: integer }
        offerCount: { type: integer }
        offerRate: { type: number, format: float, nullable: true, description: Offer 率；applicationCount < 2 时为 null（信息不足） }
    ReviewQuestionStats:
      type: object
      required: [totalCount, fullyAnsweredCount, partiallyAnsweredCount, unansweredCount, fullyAnswered]
      properties:
        totalCount: { type: integer }
        fullyAnsweredCount: { type: integer }
        partiallyAnsweredCount: { type: integer }
        unansweredCount: { type: integer }
        fullyAnswered:
          $ref: '#/components/schemas/RateFraction'
    ReviewKnowledgePointStat:
      type: object
      required: [knowledgePoint, questionCount, fullyAnsweredCount, notFullyAnsweredCount]
      properties:
        knowledgePoint: { $ref: '#/components/schemas/KnowledgePoint' }
        questionCount: { type: integer }
        fullyAnsweredCount: { type: integer }
        notFullyAnsweredCount:
          type: integer
          description: 部分答出与未答出的问题数（薄弱信号）
    ReviewQuestionTypeStat:
      type: object
      required: [type, questionCount, fullyAnsweredCount]
      properties:
        type: { type: string, nullable: true }
        questionCount: { type: integer }
        fullyAnsweredCount: { type: integer }
    ReviewInterviewResultSummary:
      type: object
      required: [reviewCount, withResultCount, passedCount, failedCount, pendingCount]
      properties:
        reviewCount: { type: integer }
        withResultCount:
          type: integer
          description: 已填写面试结果的复盘数（passed/failed/pending 之和的分母）
        passedCount: { type: integer }
        failedCount: { type: integer }
        pendingCount: { type: integer }
    TaskCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        type: { type: string, maxLength: 100 }
        knowledgePointIds: { type: array, items: { type: string, format: uuid } }
        relatedJobIds: { type: array, items: { type: string, format: uuid } }
        relatedQuestionIds: { type: array, items: { type: string, format: uuid } }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
        estimatedMinutes: { type: integer, minimum: 1 }
        dueAt: { type: string, format: date-time }
        learningGoal: { type: string, maxLength: 5000 }
        acceptanceCriteria: { type: string, maxLength: 5000 }
        verificationMethod: { type: string, maxLength: 1000 }
        outputUrl: { type: string, maxLength: 2000 }
    TaskUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/TaskCreateRequest'
        - type: object
          properties:
            verificationResult: { type: string, maxLength: 5000 }
    TaskTransitionRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus: { $ref: '#/components/schemas/TaskStatus' }
        verificationResult: { type: string, maxLength: 5000 }
        note: { type: string, maxLength: 1000 }
    LearningTask:
      type: object
      required: [id, title, status, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        type: { type: string, nullable: true }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        estimatedMinutes: { type: integer, nullable: true, minimum: 1 }
        dueAt: { type: string, format: date-time, nullable: true }
        knowledgePoints: { type: array, items: { $ref: '#/components/schemas/KnowledgePoint' } }
        sourceRefs: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        learningGoal: { type: string, nullable: true }
        acceptanceCriteria: { type: string, nullable: true }
        verificationMethod: { type: string, nullable: true }
        verificationResult: { type: string, nullable: true }
        outputUrl: { type: string, nullable: true }
        version: { type: integer }
    SkillProfile:
      type: object
      required: [skillId, skillName, selfLevel, evidenceStatus]
      properties:
        skillId: { type: string, format: uuid }
        skillName: { type: string }
        selfLevel: { type: integer, minimum: 0, maximum: 5, nullable: true, description: 用户自评等级；尚无自评记录时为 null，界面显示“未评估” }
        evidenceStatus: { type: string, nullable: true, enum: [NO_EVIDENCE, WEAK, VALID], description: 证据状态；尚无自评记录时为 null，界面显示“未评估” }
        interviewPerformance: { type: object, additionalProperties: true, nullable: true }
        version: { type: integer, description: 乐观锁版本；尚无自评记录时为 0，首次 PUT self-level 以 0 作为 If-Match-Version }
    SelfLevelUpdateRequest:
      type: object
      required: [selfLevel]
      properties:
        selfLevel: { type: integer, minimum: 0, maximum: 5 }
        reason: { type: string, maxLength: 1000 }
    SkillCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, maxLength: 100 }
    EvidenceReference:
      type: object
      required: [id, type, title]
      properties: { id: { type: string, format: uuid }, type: { type: string }, title: { type: string }, urlOrPath: { type: string, nullable: true }, trashed: { type: boolean, description: 引用来源处于最近删除时为 true，界面应显示“来源已删除” } }
    EvidenceCreateRequest:
      type: object
      required: [type, title]
      properties:
        type: { type: string, enum: [PROJECT_CODE, GIT_REPOSITORY, ARTICLE, ARCHITECTURE_DIAGRAM, API_DOCUMENT, LOAD_TEST_REPORT, LOG_OR_MONITORING, INTERVIEW_ANSWER, WORK_EXPERIENCE] }
        title: { type: string, maxLength: 200 }
        whereUsed: { type: string, maxLength: 2000 }
        problemSolved: { type: string, maxLength: 2000 }
        approach: { type: string, maxLength: 3000 }
        result: { type: string, maxLength: 2000 }
        urlOrPath: { type: string, maxLength: 2000 }
        skillIds: { type: array, items: { type: string, format: uuid } }
    Evidence:
      allOf:
        - $ref: '#/components/schemas/EvidenceCreateRequest'
        - type: object
          required: [id, version]
          properties: { id: { type: string, format: uuid }, version: { type: integer } }
    EvidenceAttachmentCreateRequest:
      type: object
      required: [displayName, sourceType, location]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        sourceType: { type: string, enum: [LOCAL_PATH, EXTERNAL_URL] }
        location: { type: string, minLength: 1, maxLength: 2000, description: 用户填写的本地路径或外部链接，仅作为文本保存 }
        mediaType: { type: string, maxLength: 100, description: 可选人工填写的 MIME 类型，不自动读取文件探测 }
        sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 2199023255552, description: 可选人工填写的大小，不自动读取文件属性 }
        description: { type: string, maxLength: 1000 }
    EvidenceAttachment:
      allOf:
        - $ref: '#/components/schemas/EvidenceAttachmentCreateRequest'
        - type: object
          required: [id, evidenceId, evidenceTitle, createdAt, updatedAt, version]
          properties:
            id: { type: string, format: uuid }
            evidenceId: { type: string, format: uuid }
            evidenceTitle: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { type: integer }
    ProjectCaseSummary:
      type: object
      required: [id, title, scenario, approach, problemSolved, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        scenario: { type: string }
        approach: { type: string }
        problemSolved: { type: string }
        result: { type: string, nullable: true, description: 结果或量化数据，可后补；仅保存用户确认的文本，不生成虚构指标 }
        evidenceRefs: { type: array, items: { $ref: '#/components/schemas/EvidenceReference' } }
        version: { type: integer }
    ProjectCaseCreateRequest:
      type: object
      required: [title, scenario, approach, problemSolved]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        scenario: { type: string, minLength: 1, maxLength: 3000 }
        approach: { type: string, minLength: 1, maxLength: 3000 }
        problemSolved: { type: string, minLength: 1, maxLength: 3000 }
        result: { type: string, maxLength: 2000 }
        evidenceIds: { type: array, items: { type: string, format: uuid } }
    UserSettingsUpdateRequest:
      type: object
      required: [timeZone]
      properties:
        timeZone: { type: string, example: Asia/Shanghai }
        defaultReminderOffsetsMinutes: { type: array, items: { type: integer, minimum: 1 }, example: [1440, 120, 30] }
    UserSettings:
      allOf:
        - $ref: '#/components/schemas/UserSettingsUpdateRequest'
        - type: object
          required: [version]
          properties: { version: { type: integer } }
    ExportCreateRequest:
      type: object
      required: [format]
      properties: { format: { type: string, enum: [JSON, CSV] } }
    DataExport:
      type: object
      required: [id, format, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        format: { type: string, enum: [JSON, CSV] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        downloadUrl: { type: string, format: uri-reference, nullable: true, description: '相对 API 下载路径，如 /api/data-exports/{exportId}/download' }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    BackupCreateRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 8, maxLength: 256, description: 仅写入；用于 PBKDF2 派生 AES-256-GCM 密钥，永不回显或存储。强度门槛（强制）：score<40（弱）返回 400，详见 POST /backups 描述与 02-state-machines.md §9 }
    BackupArmRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 8, maxLength: 256, description: 仅写入内存武装调度器（volatile）；应用重启后清空，永不回显或存储。强度门槛（强制）：score<40（弱）返回 400 }
    BackupScheduleUpdateRequest:
      type: object
      required: [cronExpression, enabled, version]
      properties:
        cronExpression: { type: string, description: 标准 5/6 字段 cron 表达式，如 "0 3 * * *" 每天 3 点 }
        enabled: { type: boolean }
        version: { type: integer, description: 当前版本，用于 If-Match-Version 乐观锁 }
    BackupSchedule:
      type: object
      required: [cronExpression, enabled, armed, version]
      properties:
        cronExpression: { type: string, description: 标准 5/6 字段 cron 表达式 }
        enabled: { type: boolean, description: 是否启用定时备份 }
        armed: { type: boolean, description: 是否已在内存武装 passphrase；应用重启后为 false，需重新武装；不回显 passphrase }
        version: { type: integer, description: 配置版本，用于乐观锁 }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastRunStatus: { type: string, enum: [SUCCESS, FAILED, SKIPPED_DISARMED], nullable: true }
        lastRunError: { type: string, nullable: true, description: lastRunStatus=FAILED 时的失败原因 }
        lastBackupId: { type: string, format: uuid, nullable: true, description: 上次成功生成的 backup_record.id }
    BackupRecord:
      type: object
      required: [id, createdAt, algorithm, pbkdf2Iterations, dataExportId, fileName, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        algorithm: { type: string, enum: [AES_256_GCM_PBKDF2] }
        pbkdf2Iterations: { type: integer, minimum: 1 }
        dataExportId: { type: string, format: uuid, description: 关联的标准数据包导出 ID }
        fileName: { type: string, description: 备份文件名，如 <id>.enc }
        sizeBytes: { type: integer, description: 密文文件字节数 }
    BackupPurgeSummary:
      type: object
      required: [deletedCount, filesCleaned, lastBackupIdCleared]
      description: 批量清理加密备份的结果摘要（按龄 olderThanDays 或按数量 keepLast 通用）
      properties:
        deletedCount: { type: integer, minimum: 0, description: 实际删除的 backup_record 行数 }
        filesCleaned: { type: integer, minimum: 0, description: 清理的 .enc 密文文件数（文件不存在不计数） }
        lastBackupIdCleared: { type: boolean, description: 被删集合是否包含 last_backup_id 指向的记录（true 表示已置空该软引用） }
    BackupOrphanCleanSummary:
      type: object
      required: [scannedFiles, orphanFiles, deletedFiles, freedBytes, skippedFiles]
      description: 孤儿 .enc 密文文件扫描清理的结果摘要
      properties:
        scannedFiles: { type: integer, minimum: 0, description: 扫描到的 backup-dir 下 .enc 文件总数 }
        orphanFiles: { type: integer, minimum: 0, description: 判定为孤儿的文件数（UUID 命名且 backup_record 无对应 file_name） }
        deletedFiles: { type: integer, minimum: 0, description: 实际删除的孤儿文件数（文件不存在不计数） }
        freedBytes: { type: integer, minimum: 0, format: int64, description: 删除前统计的孤儿文件字节数之和 }
        skippedFiles: { type: integer, minimum: 0, description: 非 UUID 命名规则的 .enc 文件数（跳过不删，避免误删无关文件） }
    DataImportPackage:
      type: object
      required: [format, exportedAt, tables]
      description: 由导出端点生成的标准数据包，原样作为请求体回传
      properties:
        format: { type: string, enum: [JSON] }
        exportedAt: { type: string, format: date-time }
        tables:
          type: object
          description: 表名到行数组（列名到值的映射）的映射；未知表与排除表（用户资料/设置、审计、幂等、导出任务、回收站）会被跳过并记录问题
          additionalProperties:
            type: array
            items: { type: object, additionalProperties: true }
    ImportTablePreview:
      type: object
      required: [tableName, packageRows, toInsert, duplicateIdentical, conflict, missingParent]
      properties:
        tableName: { type: string }
        packageRows: { type: integer, description: 数据包内该表行数 }
        toInsert: { type: integer, description: 恢复时将插入的行数（数据库缺失） }
        duplicateIdentical: { type: integer, description: 同 ID 且内容一致的行数（恢复时跳过） }
        conflict: { type: integer, description: 同 ID 但内容不同的行数（恢复时跳过，保留现状） }
        missingParent: { type: integer, description: 外键父行缺失的行数（恢复时跳过） }
    ImportIssue:
      type: object
      required: [type, detail]
      properties:
        type: { type: string, enum: [INVALID_PACKAGE, UNKNOWN_TABLE, CONFLICT, MISSING_PARENT, ROW_FAILED] }
        tableName: { type: string, nullable: true }
        rowId: { type: string, nullable: true }
        detail: { type: string }
    ImportValidationReport:
      type: object
      required: [valid, exportedAt, packageFingerprint, totalRows, insertableRows, tablePreviews, issues]
      properties:
        valid:
          type: boolean
          description: 数据包可解析且至少包含一行数据；冲突与缺父级不影响 valid（恢复时跳过）
        exportedAt: { type: string, format: date-time, nullable: true }
        packageFingerprint: { type: string, description: 数据包内容 SHA-256 指纹 }
        totalRows: { type: integer }
        insertableRows: { type: integer }
        tablePreviews: { type: array, items: { $ref: '#/components/schemas/ImportTablePreview' } }
        issues: { type: array, items: { $ref: '#/components/schemas/ImportIssue' } }
    ImportTableResult:
      type: object
      required: [tableName, inserted, skippedIdentical, skippedConflict, skippedMissingParent, failed]
      properties:
        tableName: { type: string }
        inserted: { type: integer }
        skippedIdentical: { type: integer }
        skippedConflict: { type: integer }
        skippedMissingParent: { type: integer }
        failed: { type: integer }
    ImportResultReport:
      type: object
      required: [reportId, restoredAt, packageFingerprint, status, inserted, skippedIdentical, skippedConflict, skippedMissingParent, failed, tableResults, issues, rowResults]
      description: |
        标准数据恢复结果报告（每表 inserted/skipped/failed 计数与问题明细）。
        `orphanCleanSummary` 仅由 `POST /backups/restore` 在恢复成功后自动触发孤儿清理时填充；
        `POST /data-imports/restore` 标准数据恢复不触发孤儿清理，该字段缺省。
        `passphraseResetRecommended` 仅由 `POST /backups/restore` 在恢复成功后内存评估 passphrase 为弱（score<40）时为 true（建议用强口令新建备份替换）；
        强/中为 false；标准数据恢复不评估，该字段为 null。不回显 passphrase 或 score/level。
      properties:
        reportId: { type: string, format: uuid }
        restoredAt: { type: string, format: date-time }
        packageFingerprint: { type: string }
        status: { type: string, enum: [COMPLETED, COMPLETED_WITH_SKIPS, COMPLETED_WITH_FAILURES] }
        inserted: { type: integer }
        skippedIdentical: { type: integer }
        skippedConflict: { type: integer }
        skippedMissingParent: { type: integer }
        failed: { type: integer }
        tableResults: { type: array, items: { $ref: '#/components/schemas/ImportTableResult' } }
        issues: { type: array, items: { $ref: '#/components/schemas/ImportIssue' } }
        rowResults: { type: array, items: { $ref: '#/components/schemas/ImportRowResult' } }
        orphanCleanSummary:
          nullable: true
          description: 恢复成功后自动触发的孤儿 .enc 文件扫描清理摘要（仅 POST /backups/restore 填充；标准数据恢复缺省）。清理失败仍返回尽力清理的结果，恢复结果不受影响。
          allOf:
            - $ref: '#/components/schemas/BackupOrphanCleanSummary'
        passphraseResetRecommended:
          type: boolean
          nullable: true
          description: 恢复成功后内存评估 passphrase 为弱（score<40）时为 true（建议用强口令新建备份替换，非阻塞）；强/中为 false；标准数据恢复不评估为 null。不回显 passphrase 或 score/level。仅 POST /backups/restore 填充。
    ImportRowResult:
      type: object
      required: [action]
      properties:
        tableName: { type: string }
        rowId: { type: string, nullable: true }
        action: { type: string, enum: [INSERTED, DUPLICATE_IDENTICAL, CONFLICT, MISSING_PARENT, FAILED, INVALID_PACKAGE, UNKNOWN_TABLE] }
        detail: { type: string, nullable: true }
    TrashItem:
      type: object
      required: [id, resourceType, resourceId, deletedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        displayName: { type: string }
        deletedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        impactSummary: { type: array, items: { type: string } }
    Notification:
      type: object
      required: [id, title, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        reminderId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        content: { type: string }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        deliveries:
          type: array
          description: 渠道投递状态（各渠道独立记录；仅已启用渠道在通知创建时生成投递记录）
          items: { $ref: '#/components/schemas/ChannelDelivery' }
    ChannelDelivery:
      type: object
      required: [id, notificationId, channelType, status, attemptCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        notificationId: { type: string, format: uuid }
        channelType: { type: string, enum: [BROWSER, EMAIL, WEBHOOK] }
        status: { type: string, enum: [PENDING, SENT, FAILED] }
        failureReason: { type: string, nullable: true }
        attemptCount: { type: integer }
        sentAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationChannel:
      type: object
      required: [channelType, enabled, hasCredential, version]
      properties:
        channelType: { type: string, enum: [BROWSER, EMAIL, WEBHOOK] }
        enabled: { type: boolean }
        config:
          description: 渠道配置；BROWSER 渠道为 null。EMAIL 为 EmailChannelConfig，WEBHOOK 为 WebhookChannelConfig。password 与 webhook secret 永远不回显。
          $ref: '#/components/schemas/NotificationChannelConfig'
        hasCredential: { type: boolean, description: EMAIL 渠道是否已保存密码；WEBHOOK 渠道是否已保存 secret }
        version: { type: integer }
    NotificationChannelConfig:
      oneOf:
        - $ref: '#/components/schemas/EmailChannelConfig'
        - $ref: '#/components/schemas/WebhookChannelConfig'
      discriminator:
        propertyName: channelType
        mapping:
          EMAIL: '#/components/schemas/EmailChannelConfig'
          WEBHOOK: '#/components/schemas/WebhookChannelConfig'
    EmailChannelConfig:
      type: object
      required: [channelType]
      properties:
        channelType: { type: string, const: EMAIL, description: 鉴别字段；请求中可省略，由 path channelType 决定 }
        smtpHost: { type: string, nullable: true }
        smtpPort: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        username: { type: string, nullable: true }
        password: { type: string, nullable: true, description: 仅写入；响应中永远为 null }
        fromAddress: { type: string, nullable: true }
        toAddress: { type: string, nullable: true }
        useStartTls: { type: boolean, nullable: true }
    WebhookChannelConfig:
      type: object
      required: [channelType, url]
      properties:
        channelType: { type: string, const: WEBHOOK, description: 鉴别字段；请求中可省略，由 path channelType 决定 }
        url: { type: string, description: webhook 接收端点，必须 http(s) }
        secret: { type: string, nullable: true, description: 仅写入；响应中永远为 null }
        providerType: { type: string, nullable: true, enum: [FEISHU, DINGTALK, WECOM], description: 透传存档，本切片不驱动签名或模板 }
    NotificationChannelUpdateRequest:
      type: object
      properties:
        enabled: { type: boolean }
        config: { $ref: '#/components/schemas/NotificationChannelConfig' }
    ChannelTestResult:
      type: object
      required: [channelType, notificationId, deliveries]
      properties:
        channelType: { type: string, enum: [BROWSER, EMAIL, WEBHOOK] }
        notificationId: { type: string, format: uuid }
        deliveries: { type: array, items: { $ref: '#/components/schemas/ChannelDelivery' } }
    AiProvider:
      type: object
      required: [id, providerType, name, baseUrl, model, hasCredential, isActive, version]
      properties:
        id: { type: string, format: uuid }
        providerType: { type: string, enum: [OPENAI_COMPATIBLE, ANTHROPIC] }
        name: { type: string }
        baseUrl: { type: string, description: OpenAI 兼容端点如 https://api.deepseek.com/v1；Anthropic 填 https://api.anthropic.com }
        model: { type: string }
        hasCredential: { type: boolean, description: 是否已保存 api_key（key 本身永不回显、不导出） }
        isActive: { type: boolean, description: 同一时刻仅一个激活供应商 }
        version: { type: integer }
    AiProviderCreateRequest:
      type: object
      required: [providerType, name, baseUrl, model]
      properties:
        providerType: { type: string, enum: [OPENAI_COMPATIBLE, ANTHROPIC] }
        name: { type: string, maxLength: 100 }
        baseUrl: { type: string, maxLength: 500 }
        model: { type: string, maxLength: 200 }
        apiKey: { type: string, maxLength: 500, nullable: true, description: 仅写入；更新时省略/null 表示保留既有 key }
    AiProviderTestResult:
      type: object
      required: [ok, latencyMs]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer, nullable: true }
        message: { type: string, nullable: true }
    AiJobCreateRequest:
      type: object
      required: [jobType, objectId]
      properties:
        jobType: { type: string, enum: [JD_EXTRACTION, RESUME_DRAFT] }
        objectId: { type: string, format: uuid }
        sourceText: { type: string, nullable: true, maxLength: 30000, description: RESUME_DRAFT 必填，用户已确认的简历原文 }
    AiItemPayload:
      type: object
      required: [type, rawText]
      properties:
        type: { type: string, enum: [MUST, BONUS, DRAFT, TECHNICAL, PROJECT_EXPERIENCE, SYSTEM_DESIGN, BEHAVIORAL, DOMAIN, OTHER, ANSWER_QUALITY, LEARNING_TASK] }
        rawText: { type: string, maxLength: 2000 }
        normalizedName: { type: string, maxLength: 200 }
        proficiencyText: { type: string, nullable: true, maxLength: 500 }
        rationale: { type: string, nullable: true, maxLength: 1000, description: 候选分类或分析理由；仅作为候选说明保存 }
        answerStatus: { $ref: '#/components/schemas/AnswerStatus' }
        referenceAnswer: { type: string, nullable: true, maxLength: 20000 }
        errorReason: { type: string, nullable: true, maxLength: 5000 }
        improvementPlan: { type: string, nullable: true, maxLength: 5000 }
        taskTitle: { type: string, nullable: true, maxLength: 200 }
        priority: { type: string, nullable: true, enum: [LOW, MEDIUM, HIGH, URGENT] }
        estimatedMinutes: { type: integer, nullable: true, minimum: 1 }
        learningGoal: { type: string, nullable: true, maxLength: 5000 }
        acceptanceCriteria: { type: string, nullable: true, maxLength: 5000 }
        verificationMethod: { type: string, nullable: true, maxLength: 1000 }
        knowledgePointIds: { type: array, nullable: true, items: { type: string, format: uuid } }
    AiJobItem:
      type: object
      required: [id, aiJobId, payload, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        aiJobId: { type: string, format: uuid }
        payload: { $ref: '#/components/schemas/AiItemPayload' }
        editedPayload:
          description: 采纳时的编辑内容；为 null 表示未编辑
          $ref: '#/components/schemas/AiItemPayload'
        status: { type: string, enum: [PROPOSED, ACCEPTED, REJECTED] }
        requirementId: { type: string, format: uuid, nullable: true, description: 采纳后创建的岗位要求 id }
        taskId: { type: string, format: uuid, nullable: true, description: 采纳后创建的学习任务 id }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AiJob:
      type: object
      required: [id, jobType, objectId, status, providerType, model, promptVersion, attemptCount, items, createdAt]
      properties:
        id: { type: string, format: uuid }
        jobType: { type: string, enum: [JD_EXTRACTION, RESUME_DRAFT, QUESTION_CLASSIFICATION, ANSWER_QUALITY_ANALYSIS, TASK_SUGGESTION, MOCK_INTERVIEW, MOCK_INTERVIEW_FOLLOW_UP, MOCK_INTERVIEW_ANSWER_EVALUATION] }
        objectId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED] }
        providerType: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        attemptCount: { type: integer }
        failureReason: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/AiJobItem' } }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AiJobItemAcceptRequest:
      type: object
      properties:
        payload:
          description: 编辑后的候选内容；省略表示按原文采纳
          $ref: '#/components/schemas/AiItemPayload'
    MockInterviewCreateRequest:
      type: object
      required: [projectId]
      properties: { projectId: { type: string, format: uuid } }
    ResumeVersionCreateRequest:
      type: object
      required: [name, content]
      properties: { name: { type: string, minLength: 1, maxLength: 100 }, content: { type: string, minLength: 1, maxLength: 30000 } }
    ResumeVersion:
      type: object
      required: [id, name, content, createdAt, updatedAt, version]
      properties: { id: { type: string, format: uuid }, name: { type: string }, content: { type: string }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, version: { type: integer } }
    ResumeVersionComparison:
      type: object
      required: [leftVersion, rightVersion, lines]
      properties: { leftVersion: { $ref: '#/components/schemas/ResumeVersion' }, rightVersion: { $ref: '#/components/schemas/ResumeVersion' }, lines: { type: array, items: { $ref: '#/components/schemas/ResumeVersionComparisonLine' } } }
    ResumeVersionComparisonLine:
      type: object
      required: [kind, text]
      properties: { kind: { type: string, enum: [UNCHANGED, ADDED, REMOVED] }, text: { type: string } }
    MockInterviewTransitionRequest:
      type: object
      required: [targetStatus]
      properties: { targetStatus: { type: string, enum: [COMPLETED, CANCELED] } }
    MockInterviewAnswerRequest:
      type: object
      required: [content]
      properties: { content: { type: string, minLength: 1, maxLength: 10000 } }
    MockInterviewSession:
      type: object
      required: [id, projectId, status, version]
      properties: { id: { type: string, format: uuid }, projectId: { type: string, format: uuid }, status: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, CANCELED] }, aiJobId: { type: string, format: uuid, nullable: true }, followUpAiJobId: { type: string, format: uuid, nullable: true }, version: { type: integer } }
    MockInterviewTurn:
      type: object
      required: [id, sessionId, turnNumber, speaker, content, createdAt]
      properties: { id: { type: string, format: uuid }, sessionId: { type: string, format: uuid }, turnNumber: { type: integer }, speaker: { type: string, enum: [AI, USER] }, content: { type: string }, evaluationAiJobId: { type: string, format: uuid, nullable: true }, evaluationScore: { type: integer, minimum: 1, maximum: 5, nullable: true }, evaluationFeedback: { type: string, nullable: true }, evaluationRationale: { type: string, nullable: true }, evaluationCompletedAt: { type: string, format: date-time, nullable: true }, createdAt: { type: string, format: date-time } }
    MockInterviewEvaluationSummary:
      type: object
      required: [evaluatedAnswerCount, evaluatedSessionCount, scoreDistribution, recentScores]
      properties:
        evaluatedAnswerCount: { type: integer, minimum: 0 }
        evaluatedSessionCount: { type: integer, minimum: 0 }
        averageScore: { type: number, format: double, nullable: true, description: 少于两条评分时返回 null，避免以单次练习代表整体表现 }
        scoreDistribution: { type: array, items: { $ref: '#/components/schemas/MockInterviewScoreCount' } }
        recentScores: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/MockInterviewRecentScore' } }
    MockInterviewEvaluationTrend:
      type: object
      required: [currentWindow, compareWindow]
      properties:
        currentWindow: { $ref: '#/components/schemas/MockInterviewEvaluationWindow' }
        compareWindow: { $ref: '#/components/schemas/MockInterviewEvaluationWindow' }
        averageScoreDelta: { type: number, format: double, nullable: true, description: 当前窗口平均分减去对比窗口平均分；任一窗口少于两条评分时为 null }
    MockInterviewEvaluationWindow:
      type: object
      required: [from, to, evaluatedAnswerCount, evaluatedSessionCount, scoreDistribution]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        evaluatedAnswerCount: { type: integer, minimum: 0 }
        evaluatedSessionCount: { type: integer, minimum: 0 }
        averageScore: { type: number, format: double, nullable: true, description: 少于两条评分时返回 null }
        scoreDistribution: { type: array, items: { $ref: '#/components/schemas/MockInterviewScoreCount' } }
    MockInterviewScoreCount:
      type: object
      required: [score, count]
      properties: { score: { type: integer, minimum: 1, maximum: 5 }, count: { type: integer, minimum: 0 } }
    MockInterviewRecentScore:
      type: object
      required: [sessionId, turnId, score, evaluatedAt]
      properties: { sessionId: { type: string, format: uuid }, turnId: { type: string, format: uuid }, score: { type: integer, minimum: 1, maximum: 5 }, evaluatedAt: { type: string, format: date-time } }
    PageJob:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/JobListItem' } }, page: { type: integer }, pageSize: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    PageApplication:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Application' } }, page: { type: integer }, pageSize: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    PageTask:
      type: object
      required: [items, page, pageSize, total]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/LearningTask' } }, page: { type: integer }, pageSize: { type: integer }, total: { type: integer } }
